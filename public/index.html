
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Facebook Video Downloader</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
    .container { background: #1e293b; border: 1px solid #334155; padding: 32px; border-radius: 12px; width: 100%; max-width: 480px; text-align: center; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3); }
    h1 { font-size: 1.5rem; margin-bottom: 24px; color: #38bdf8; }
    input { width: 100%; padding: 12px 16px; border: 1px solid #475569; border-radius: 8px; background: #0f172a; color: #fff; font-size: 1rem; margin-bottom: 16px; outline: none; }
    input:focus { border-color: #38bdf8; }
    button { width: 100%; padding: 12px 16px; background: #0284c7; color: #fff; font-weight: 600; font-size: 1rem; border: none; border-radius: 8px; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #0369a1; }
    #status { margin-top: 20px; word-break: break-word; }
    .dl-btn { display: inline-block; width: 100%; margin-top: 12px; padding: 12px 16px; background: #16a34a; color: #fff; text-decoration: none; border-radius: 8px; font-weight: 600; }
    .dl-btn:hover { background: #15803d; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Facebook Downloader</h1>
    <input type="text" id="fbUrl" placeholder="Paste Facebook video or reel link...">
    <button onclick="fetchLink()">Get Download Link</button>
    <div id="status"></div>
  </div>

  <script>
    async function fetchLink() {
      const url = document.getElementById('fbUrl').value.trim();
      const status = document.getElementById('status');
      if (!url) return alert('Please paste a Facebook URL');

      status.innerHTML = '<p style="color: #94a3b8;">Processing video...</p>';

      try {
        const response = await fetch('/api/download', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url })
        });
        const data = await response.json();

        if (data.error) {
          status.innerHTML = `<p style="color: #f87171;">${data.error}</p>`;
        } else {
          status.innerHTML = `
            <p style="margin-bottom: 10px;"><strong>${data.title}</strong></p>
            <a class="dl-btn" href="${data.downloadUrl}" target="_blank" download>Download Video MP4</a>
          `;
        }
      } catch (err) {
        status.innerHTML = '<p style="color: #f87171;">Server connection failed.</p>';
      }
    }
  </script>
</body>
</html>
